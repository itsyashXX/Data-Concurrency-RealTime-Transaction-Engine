name: Android Release APK Build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v2.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build, Sign & Release Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Configure Production Keystore (if Secrets Present)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Custom release keystore secrets detected. Setting up signing config..."
            echo "$KEYSTORE_BASE64" | base64 --decode > mobile-app/android/app/release.keystore
            cat <<EOF > mobile-app/android/key.properties
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
            echo "has_custom_key=true" >> $GITHUB_OUTPUT
          else
            echo "No custom keystore secrets found. Building release APK with standard Android signing."
            echo "has_custom_key=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android Release APK
        working-directory: mobile-app
        run: flutter build apk --release

      - name: Verify Release APK & Integrity
        run: |
          APK_PATH="mobile-app/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "SUCCESS: Release APK verified at $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: Release APK generation failed!"
            exit 1
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataCore-Pay-release.apk
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 60
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        with:
          files: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          name: "DataCore Pay ${{ github.ref_name || github.event.inputs.release_tag }}"
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
