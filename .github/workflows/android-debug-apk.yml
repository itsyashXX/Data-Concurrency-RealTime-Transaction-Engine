name: Android Debug APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Build Android Debug APK
        working-directory: mobile-app
        run: flutter build apk --debug

      - name: Verify Debug APK Exists
        run: |
          APK_PATH="mobile-app/build/app/outputs/flutter-apk/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "SUCCESS: Debug APK verified at $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: Debug APK not found at $APK_PATH"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataCore-Pay-debug.apk
          path: mobile-app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error
